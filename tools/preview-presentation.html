<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption objects</title>
<link rel="stylesheet" href="../presentation/designer/theme.css">
<style>
body{margin:0;padding:28px}main{max-width:1120px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}h1{font-size:21px;font-weight:600;margin:0 0 22px}h2{font-size:14px;font-weight:600;margin:0 0 12px}aside{padding-top:4px}label{display:block;font-size:12px;margin:16px 0 6px}textarea,select{width:100%;padding:10px}textarea{height:130px;resize:vertical}header{display:flex;align-items:center;justify-content:space-between}.stage{height:500px;position:relative;overflow:hidden;border:1px solid var(--xrt-border);border-radius:20px;background-color:#e9eded;background-image:radial-gradient(#adb7b638 .8px,transparent .8px);background-size:20px 20px}.caption{display:flex;flex-direction:column;justify-content:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;white-space:pre;cursor:move;touch-action:none;font-weight:400;outline:1px solid #b9c4c43d;outline-offset:5px}.caption.board{outline:1px dashed #a7b4b49c;outline-offset:12px}.caption:focus-visible{outline:2px solid var(--xrt-accent)}.stage-label{position:absolute;top:14px;left:18px;font-size:11px;color:var(--xrt-muted);pointer-events:none}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}.preset{padding:12px 5px;font-size:12px;display:grid;justify-items:center;gap:8px}.preset svg{height:40px;width:58px;stroke:var(--xrt-normal);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.row{display:flex;gap:8px;align-items:center}.toolbar{display:flex;gap:8px;margin-top:16px}.hint{font-size:12px;color:var(--xrt-muted);margin:12px 0}.check{display:flex;gap:8px;align-items:center;font-size:12px}.check input{accent-color:var(--xrt-selected)}.source{padding:12px;max-height:130px;overflow:auto;font-size:12px;white-space:pre-wrap;border-radius:8px;background:#ffffff80;color:var(--xrt-muted)}details{margin-top:22px}summary{font-size:12px;color:var(--xrt-normal);cursor:pointer}#state{font-size:12px;color:var(--xrt-muted)}@media(max-width:800px){body{padding:16px}main{grid-template-columns:1fr}.stage{height:460px}aside{max-width:560px}}
</style></head><body class="xrt-ui">
<main><section><header><h1>Caption objects</h1><span id="state">Preview</span></header><div class="stage" id="stage"><span class="stage-label">Drag to position · Arrow keys to move</span><div class="caption" id="caption" tabindex="0" aria-label="Caption object"></div></div><p class="hint">Choose a shape, then place and style the object in your game.</p></section>
<aside><h2>Object</h2><div class="presets">
<button class="preset" data-preset="horizontal" aria-label="Horizontal bubble" aria-pressed="true" title="Horizontal bubble"><svg viewBox="0 0 64 44"><rect x="3" y="10" width="58" height="27" rx="5"/><path d="M11 19h39M11 28h29"/></svg>Horizontal</button>
<button class="preset" data-preset="vertical" aria-label="Portrait bubble" aria-pressed="false" title="Portrait bubble"><svg viewBox="0 0 64 44"><rect x="20" y="2" width="25" height="40" rx="5"/><path d="M26 11h13M26 18h13M26 25h13M26 32h9"/></svg>Portrait</button>
<button class="preset" data-preset="board" aria-label="Board lettering" aria-pressed="false" title="Board lettering"><svg viewBox="0 0 64 44"><path d="m5 7 54 3-3 31-53-5z" stroke-dasharray="3 3"/><path d="M13 20q5-6 9-1t8-1 8 0 8-1M12 29q7-5 13 0t13 0"/></svg>Board</button>
</div><label for="sample">Sample</label><select id="sample"><option value="mixed">Mixed text</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select>
<label for="text">Preview text</label><textarea id="text"></textarea>
<label class="check"><input type="checkbox" id="hold" checked> Hold preview</label>
<div class="toolbar"><button class="icon-button" id="show" title="Show text" aria-label="Show text"><svg class="icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg></button><button class="icon-button" id="clear" title="Clear text" aria-label="Clear text"><svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><button class="icon-button" id="center" title="Center object" aria-label="Center object"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button></div>
<details><summary>Text source</summary><p class="source" id="source"></p></details>
</aside></main><script src="../presentation/javascript/bubble.js"></script><script src="../presentation/designer/preview.js"></script></body></html>
