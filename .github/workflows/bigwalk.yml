name: Build Big Walk bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - adapters/bigwalk/**
      - docs/adapters/bigwalk/**
      - tools/build_bigwalk.py
      - .github/workflows/bigwalk.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build_bigwalk.py
      - uses: actions/upload-artifact@v4
        with:
          name: XRT-Avatar-Plugin-BigWalk
          path: dist/bigwalk/*.zip
          if-no-files-found: error
