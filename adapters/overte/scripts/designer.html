<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captions</title>
<link rel="stylesheet" href="../../../presentation/designer/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--xrt-bg,#f2f4f4);color:var(--xrt-text,#1e2428);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:560px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:22px;font-weight:600;margin:0}h2,label.field{font-size:14px;font-weight:600;margin:0 0 12px;display:block}section{margin:0 0 26px}.muted{color:var(--xrt-muted,#697275);font-size:13px;margin:10px 0 0}button,select{font:inherit;border:1px solid #d9dede;border-radius:8px;background:#fff;color:inherit}button{cursor:pointer;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}button:hover{background:#e8eded}button:focus-visible,select:focus-visible{outline:2px solid var(--xrt-accent,#1d4ed8);outline-offset:3px}button:disabled{opacity:.4;cursor:default}button.active{background:#f4f7ff;border-color:var(--xrt-selected,#2563eb)}button svg{height:21px;width:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.preset{display:flex;flex-direction:column;gap:12px;padding:16px 8px;font-size:13px}.sample{height:75px;width:100%;display:flex;align-items:center;justify-content:center}.sample svg{width:80px;height:64px;stroke:#697275;stroke-width:1.5}.row{display:flex;align-items:center;gap:8px}.row select{min-width:0;width:100%;height:42px;padding:0 10px}.tools{margin-top:12px;display:flex;justify-content:space-between;align-items:center}.check{font-size:13px;display:flex;gap:8px;align-items:center}.check input{accent-color:var(--xrt-selected,#2563eb);width:16px;height:16px}.source{min-height:72px;max-height:130px;overflow:auto;border:1px solid #d9dede;border-radius:8px;background:#fff;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:#3e464a}#message{color:#856437;font-size:13px;margin-top:12px}#connection{margin:0;text-align:right;font-size:12px;color:#697275}.status-controls{display:flex;align-items:center;gap:10px}
</style></head><body class="xrt-ui"><main class="page">
<header><h1>Captions</h1><div class="status-controls"><span id="connection">Connecting</span><button id="control" title="Connect XRTranslate" aria-label="Connect XRTranslate" disabled><svg viewBox="0 0 24 24"><path d="M8 15l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0M16 9l2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0M8 16l8-8"/></svg></button></div></header>
<section><h2>New object</h2><div class="row" style="margin-bottom:12px"><select id="audience" aria-label="New object visibility"><option value="avatar">Wear with Avatar · visible to others</option><option value="local">Only me</option></select></div><div class="presets">
<button class="preset" data-profile="horizontal" title="Create a horizontal text object" aria-label="Create a horizontal text object"><span class="sample"><svg viewBox="0 0 90 70"><rect x="6" y="21" width="78" height="30" rx="5"/><path d="M16 31h56M16 41h38"/></svg></span><span>Horizontal</span></button>
<button class="preset" data-profile="vertical" title="Create a portrait text object" aria-label="Create a portrait text object"><span class="sample"><svg viewBox="0 0 90 70"><rect x="27" y="5" width="36" height="60" rx="5"/><path d="M35 17h20M35 26h20M35 35h20M35 44h20M35 53h13"/></svg></span><span>Portrait</span></button>
<button class="preset" data-profile="board" title="Create text for a board" aria-label="Create text for a board"><span class="sample"><svg viewBox="0 0 90 70"><path d="M12 48l5-32 62 4-4 36-63-8z" stroke-dasharray="3 4"/><path d="M24 29q7-7 10 0t10-1 10 0 10-1M22 39q7-5 13 0t13 0"/></svg></span><span>Board</span></button>
</div></section>
<section><label class="field" for="targets">Text object</label><div class="row"><select id="targets"><option value="">Choose an object</option></select><button id="refresh" title="Refresh nearby objects" aria-label="Refresh nearby objects"><svg viewBox="0 0 24 24"><path d="M19 9a8 8 0 1 0 1 7M19 3v6h-6"/></svg></button><button id="bind" title="Bind selected object" aria-label="Bind selected object" disabled><svg viewBox="0 0 24 24"><path d="M9 15l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0M15 9l2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0M8 16l8-8"/></svg></button></div>
<p id="bound" class="muted">No object selected</p><div class="tools"><label class="check"><input type="checkbox" id="hide">Hide when empty</label><div class="row"><button id="preview" title="Preview text" aria-label="Preview text" disabled><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><button id="unbind" title="Unbind object" aria-label="Unbind object" disabled><svg viewBox="0 0 24 24"><path d="M9 15l-2 2a4 4 0 0 1-5-5l3-3M15 9l2-2a4 4 0 0 1 5 5l-3 3M3 3l18 18"/></svg></button></div></div>
<p class="muted">Move, resize and style the object in Create.</p><p id="message" role="status"></p></section>
<section><h2>Translation</h2><div id="source" class="source muted">Waiting for translation</div></section>
</main><script>
(function(){
'use strict';
var bridge=null,connected=false,state=null,targets=document.getElementById('targets');
function send(action,fields){if(!bridge)return;var message={app:'xrt-caption-designer',action:action};Object.keys(fields||{}).forEach(function(key){message[key]=fields[key];});bridge.emitWebEvent(JSON.stringify(message));}
function button(name,action){document.getElementById(name).addEventListener('click',function(){send(action);});}
button('refresh','refresh');button('preview','preview');button('unbind','unbind');button('control','control');
document.getElementById('bind').addEventListener('click',function(){send('bind',{id:targets.value,hideWhenEmpty:document.getElementById('hide').checked});});
document.getElementById('hide').addEventListener('change',function(){send('visibility',{hideWhenEmpty:this.checked});});
targets.addEventListener('change',function(){document.getElementById('bind').disabled=!targets.value;});
Array.prototype.forEach.call(document.querySelectorAll('[data-profile]'),function(button){button.addEventListener('click',function(){send('create',{profile:button.getAttribute('data-profile'),audience:document.getElementById('audience').value});});});
var icons={connect:'<path d="M9 15l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0M15 9l2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0M8 16l8-8"/>',start:'<path d="M8 4l13 8-13 8z"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',waiting:'<path d="M7 3h10M7 21h10M8 3v5l8 8v5M16 3v5L8 16v5"/>',retry:'<path d="M19 9a8 8 0 1 0 1 7M19 3v6h-6"/>'};
function receive(raw){
var message;try{message=JSON.parse(raw);}catch(error){return;}if(message.app!=='xrt-caption-designer'||message.type!=='state')return;
connected=true;var previousTarget=state&&state.binding.target;state=message;var selected=targets.value||message.binding.target;if(message.binding.target&&previousTarget!==message.binding.target)selected=message.binding.target;while(targets.options.length>1)targets.remove(1);
message.items.forEach(function(item){var option=document.createElement('option');option.value=item.id;option.textContent=item.name+(item.shared?' · visible to others':' · only you');targets.appendChild(option);});
if(message.binding.target&&(!selected||selected===message.binding.target))selected=message.binding.target;targets.value=selected;
document.getElementById('bind').disabled=!targets.value;document.getElementById('unbind').disabled=!message.binding.target;document.getElementById('preview').disabled=!message.binding.target;document.getElementById('preview').setAttribute('aria-pressed',message.binding.preview?'true':'false');document.getElementById('preview').title=message.binding.preview?'Stop preview':'Preview text';document.getElementById('preview').setAttribute('aria-label',message.binding.preview?'Stop preview':'Preview text');
document.getElementById('hide').checked=message.binding.hideWhenEmpty;document.getElementById('hide').disabled=!message.binding.target;
document.getElementById('bound').textContent=message.binding.target?'Bound to '+message.binding.name+(message.binding.shared?' · visible to others':' · only you'):'No object selected';
document.getElementById('message').textContent=message.binding.message||'';
document.getElementById('source').textContent=message.caption?message.caption.text:'Waiting for translation';
var control=document.getElementById('control');control.title=message.control.hint;control.setAttribute('aria-label',message.control.hint);control.disabled=!message.control.enabled;control.className=message.control.active?'active':'';control.innerHTML='<svg viewBox="0 0 24 24">'+icons[message.control.icon]+'</svg>';
document.getElementById('connection').textContent=message.control.active?'Translating':message.control.icon==='waiting'?'Waiting':message.control.action==='pair'?'Disconnected':'Ready';
}
var handshake=setInterval(function(){if(!bridge&&typeof EventBridge!=='undefined'){bridge=EventBridge;bridge.scriptEventReceived.connect(receive);}if(bridge&&!connected)send('ready');if(connected)clearInterval(handshake);},200);
}());
</script></body></html>
